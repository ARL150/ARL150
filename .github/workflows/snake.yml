name: Animaciones y métricas del perfil

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Viborita de contribuciones
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#6366F1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA

      - name: Calendario isométrico
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics-isocalendar.svg
          output_action: none
          base: ""
          config_timezone: America/Mexico_City
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Juntar archivos
        run: |
          sudo ls -la /metrics_renders dist || true
          sudo cp /metrics_renders/metrics-isocalendar.svg dist/
          sudo chown -R "$(id -u):$(id -g)" dist

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Lenguajes más usados
        run: python3 -I repo/scripts/languages.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
