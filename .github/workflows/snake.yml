name: Animaciones del perfil

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Viborita de contribuciones
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#6366F1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA

      - name: Permisos de la carpeta de salida
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Lenguajes más usados
        run: python3 -I repo/scripts/languages.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
